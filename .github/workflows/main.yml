name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Reconstruct project structure
        run: |
          echo "Converting flat files to proper folders..."
          
          mkdir -p app/src/main/java/com/voicechanger
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/mipmap-anydpi-v26
          mkdir -p app/src/main/res/mipmap-hdpi
          mkdir -p app/src/main/res/mipmap-mdpi
          mkdir -p app/src/main/res/mipmap-xhdpi
          mkdir -p app/src/main/res/mipmap-xxhdpi
          mkdir -p app/src/main/res/mipmap-xxxhdpi
          mkdir -p gradle/wrapper

          mv -f app__build.gradle app/build.gradle || true
          mv -f app__proguard-rules.pro app/proguard-rules.pro || true
          mv -f app__src__main__AndroidManifest.xml app/src/main/AndroidManifest.xml || true
          mv -f app__src__main__java__com__voicechanger__MainActivity.java app/src/main/java/com/voicechanger/MainActivity.java || true
          mv -f app__src__main__java__com__voicechanger__VoiceEffectProcessor.java app/src/main/java/com/voicechanger/VoiceEffectProcessor.java || true
          mv -f app__src__main__res__drawable__bg_rounded.xml app/src/main/res/drawable/bg_rounded.xml || true
          mv -f app__src__main__res__drawable__ic_launcher_foreground.xml app/src/main/res/drawable/ic_launcher_foreground.xml || true
          mv -f app__src__main__res__layout__activity_main.xml app/src/main/res/layout/activity_main.xml || true
          mv -f app__src__main__res__mipmap-anydpi-v26__ic_launcher.xml app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml || true
          mv -f app__src__main__res__mipmap-hdpi__ic_launcher.xml app/src/main/res/mipmap-hdpi/ic_launcher.xml || true
          mv -f app__src__main__res__mipmap-mdpi__ic_launcher.xml app/src/main/res/mipmap-mdpi/ic_launcher.xml || true
          mv -f app__src__main__res__mipmap-xhdpi__ic_launcher.xml app/src/main/res/mipmap-xhdpi/ic_launcher.xml || true
          mv -f app__src__main__res__mipmap-xxhdpi__ic_launcher.xml app/src/main/res/mipmap-xxhdpi/ic_launcher.xml || true
          mv -f app__src__main__res__mipmap-xxxhdpi__ic_launcher.xml app/src/main/res/mipmap-xxxhdpi/ic_launcher.xml || true
          mv -f app__src__main__res__values__colors.xml app/src/main/res/values/colors.xml || true
          mv -f app__src__main__res__values__strings.xml app/src/main/res/values/strings.xml || true
          mv -f app__src__main__res__values__styles.xml app/src/main/res/values/styles.xml || true

          # Remove broken wrapper
          rm -f gradle/wrapper/gradle-wrapper.jar gradlew gradlew.bat || true

          echo "=== Project structure ==="
          find . -type f | head -40

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false
          packages: 'platforms;android-34 build-tools;34.0.0 platform-tools'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Generate Gradle Wrapper
        run: |
          gradle wrapper --gradle-version 8.7
          chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VoiceChanger-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30
          if-no-files-found: warn
